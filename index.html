<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>产后护理与宝宝养育日历</title>
<style>
:root{--main:#E8876B;--main-soft:#FBE9E2;--ink:#3A2E2A;--sub:#9A8B85;--bg:#FBF7F5;--card:#fff;--line:#F0E4DF;--warn:#D9534F;--chip:#F7E8E2;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Helvetica Neue',sans-serif;background:var(--bg);color:var(--ink);max-width:520px;margin:0 auto;}
.appbar{position:sticky;top:0;z-index:10;background:var(--main);color:#fff;padding:14px 16px 12px;border-radius:0 0 18px 18px;}
.appbar h1{font-size:19px;font-weight:600;}
.appbar .sub{font-size:12px;opacity:.85;margin-top:2px;}
main{padding:12px 12px 84px;}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(180,120,100,.08);}
.card h3{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.card h3 .more{font-size:12px;color:var(--main);font-weight:400;}
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20;}
.nav-item{flex:1;text-align:center;padding:8px 0 6px;color:var(--sub);font-size:11px;cursor:pointer;}
.nav-item .ico{font-size:20px;display:block;line-height:1.2;}
.nav-item.active{color:var(--main);font-weight:600;}
.fab{position:fixed;right:16px;bottom:76px;width:52px;height:52px;border-radius:50%;background:var(--main);color:#fff;font-size:26px;border:none;box-shadow:0 4px 12px rgba(232,135,107,.4);z-index:15;cursor:pointer;}
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));z-index:31;max-height:82vh;overflow:auto;}
.sheet h2{font-size:16px;margin-bottom:12px;}
.frow{margin-bottom:12px;}
.frow label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px;}
.frow input,.frow select,.frow textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;background:#FFFEFD;font-family:inherit;}
.frow .err{color:var(--warn);font-size:12px;margin-top:4px;display:none;}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:12px;background:var(--main);color:#fff;font-size:16px;cursor:pointer;margin-top:6px;}
.btn.ghost{background:var(--main-soft);color:var(--main);}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:13px;margin-top:0;}
.quick{display:flex;gap:8px;margin-bottom:12px;}
.quick button{flex:1;padding:10px 0;border:none;border-radius:12px;background:var(--main-soft);color:var(--main);font-size:13px;cursor:pointer;}
.stat{display:flex;gap:8px;}
.stat .s{flex:1;background:var(--main-soft);border-radius:12px;padding:10px;text-align:center;}
.stat .s b{display:block;font-size:18px;color:var(--main);}
.stat .s span{font-size:11px;color:var(--sub);}
.banner{background:#FDECEA;border:1px solid #F5C6C0;color:#B03A34;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;cursor:pointer;}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);font-size:14px;gap:8px;}
.list-item:last-child{border-bottom:none;}
.list-item .ops button{border:none;background:none;color:var(--warn);font-size:13px;cursor:pointer;padding:2px 4px;}
.chip{display:inline-block;background:var(--chip);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--main);margin:2px 4px 2px 0;}
.chip.free{background:#E8F4EC;color:#3E7D5C;}
.chip.paid{background:#FBF0DC;color:#A2702A;}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:18px 0;}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:rgba(58,46,42,.9);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:99;}
.seg{display:flex;background:var(--main-soft);border-radius:12px;padding:3px;margin-bottom:12px;}
.seg button{flex:1;border:none;background:none;padding:8px 0;font-size:13px;color:var(--main);border-radius:10px;cursor:pointer;}
.seg button.active{background:#fff;font-weight:600;}
canvas{max-width:100%;}
.wizard{padding:24px 20px;min-height:100vh;background:var(--bg);}
.wizard h1{font-size:22px;margin-bottom:6px;color:var(--main);}
.wizard p.tip{font-size:13px;color:var(--sub);margin-bottom:20px;}
.checkline{display:flex;align-items:center;gap:8px;padding:8px 2px;font-size:14px;}
.checkline input{width:18px;height:18px;accent-color:var(--main);}
.checkline.done{color:var(--sub);text-decoration:line-through;}
.article ul{margin:4px 0;}
.article li{font-size:13px;color:#5C4F49;line-height:1.7;margin-left:18px;}
.article h4{font-size:14px;margin:10px 0 2px;color:var(--ink);}
.warn-note{font-size:11px;color:var(--sub);margin-top:8px;}
</style>
</head>
<body>
<div id="wizard"></div>
<div id="app" hidden>
  <header class="appbar"><h1 id="appTitle">今日</h1><div class="sub" id="appSub"></div></header>
  <main>
    <section class="screen" id="screen-home"></section>
    <section class="screen" id="screen-records" hidden></section>
    <section class="screen" id="screen-growth" hidden></section>
    <section class="screen" id="screen-vaccine" hidden></section>
    <section class="screen" id="screen-mom" hidden></section>
  </main>
  <nav class="bottomnav" id="bottomnav"></nav>
  <button class="fab" id="fab">＋</button>
  <div id="sheetRoot"></div>
</div>

<script id="logic">
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function fmtDate(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function todayStr(){return fmtDate(new Date());}
function nowStr(){const p=n=>String(n).padStart(2,'0');const d=new Date();return fmtDate(d)+' '+p(d.getHours())+':'+p(d.getMinutes());}
function parseDt(s){const [d,t]=s.split(' ');const [y,mo,da]=d.split('-').map(Number);const [h,mi]=t.split(':').map(Number);return new Date(y,mo-1,da,h,mi);}
function fmtDt(d){const p=n=>String(n).padStart(2,'0');return fmtDate(d)+' '+p(d.getHours())+':'+p(d.getMinutes());}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function daysBetween(fromStr,toStr){return Math.round((parseDate(toStr)-parseDate(fromStr))/86400000);}
function ageInDays(birthStr,onStr){return daysBetween(birthStr,onStr);}
function ageInMonths(birthStr,onStr){const b=parseDate(birthStr),o=parseDate(onStr);let m=(o.getFullYear()-b.getFullYear())*12+(o.getMonth()-b.getMonth());if(o.getDate()<b.getDate())m--;return m;}
function addMonths(dateStr,n){const d=parseDate(dateStr);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return fmtDate(d);}
function ppStage(birthStr,onStr){
  const d=ageInDays(birthStr,onStr);
  const week=Math.floor(d/7)+1;
  if(d<=6) return {id:'p1',label:'月子期 · 第1周',week};
  if(d<=13) return {id:'p2',label:'月子期 · 第'+week+'周',week};
  if(d<=20) return {id:'p3',label:'月子期 · 第'+week+'周',week};
  if(d<=41) return {id:'p4',label:'月子期 · 第4-6周',week};
  const m=ageInMonths(birthStr,onStr);
  return {id:'p5',label:'哺乳期 · '+m+' 个月',week:null};
}
function feedingSum(feedings,date){
  const list=feedings.filter(f=>f.dt.startsWith(date));
  return {count:list.length, ml:list.reduce((s,f)=>s+(f.ml||0),0),
    last:list.length?list.reduce((m,f)=>f.dt>m?f.dt:m,list[0].dt):null};
}
function lastNDays(n,onStr){const out=[];const base=parseDate(onStr);for(let i=n-1;i>=0;i--){out.push(fmtDate(new Date(base.getFullYear(),base.getMonth(),base.getDate()-i)));}return out;}
function daySeries(dates,items,pick){return dates.map(d=>items.reduce((s,it)=>{const v=pick(it,d);return v==null?s:s+v;},0));}
function sleepMin(startDt,endDt){return Math.round((parseDt(endDt)-parseDt(startDt))/60000);}
function sleepDateKey(s){return s.start.slice(0,10);}
function vaccineDueDate(birthStr,v){return addMonths(birthStr,v.month);}
function vaccineStatus(v,rec,birthStr,onStr){
  const dueDate=vaccineDueDate(birthStr,v);
  if(rec&&rec.done)return {status:'done',dueDate};
  const diff=daysBetween(onStr,dueDate); // >0 未到, <=0 已到
  if(diff<=0)return {status:'due',dueDate};
  if(diff<=7)return {status:'soon',dueDate};
  return {status:'future',dueDate};
}
function whoPercentiles(who,gender,metric){
  const t=who[gender][metric];
  const ages=Object.keys(t).map(Number).sort((a,b)=>a-b);
  const series={};
  for(const p of ['p3','p25','p50','p75','p97'])series[p]=ages.map(a=>t[a][p]);
  return {ages,series};
}
function dietPlan(diet,stageId,dateStr){const plans=diet[stageId];return plans[parseDate(dateStr).getDay()%plans.length];}
function solidsStage(months,solids){if(months<6)return null;for(const s of solids){if(months>=s.min&&months<=s.max)return s;}return solids[solids.length-1];}
window.L = {parseDate,fmtDate,todayStr,nowStr,parseDt,fmtDt,uid,daysBetween,ageInDays,ageInMonths,addMonths,ppStage,feedingSum,lastNDays,daySeries,sleepMin,sleepDateKey,vaccineDueDate,vaccineStatus,whoPercentiles,dietPlan,solidsStage};
</script>
<script id="store">
window.Store = (function(){
  const KEY='pp_app_v1', BAK='pp_app_v1_bak';
  function blank(){return {profile:null,feedings:[],sleeps:[],diapers:[],growth:[],vaccineRecords:{},recovery:[],checks:{},foodLog:[],dietChoice:{}};}
  const ARR=['feedings','sleeps','diapers','growth','recovery','foodLog'];
  const OBJ=['vaccineRecords','checks','dietChoice'];
  function validate(raw){
    if(!raw||typeof raw!=='object'||Array.isArray(raw))return null;
    const s=blank();
    s.profile=(raw.profile&&typeof raw.profile==='object')?raw.profile:null;
    for(const k of ARR)s[k]=Array.isArray(raw[k])?raw[k]:[];
    for(const k of OBJ)s[k]=(raw[k]&&typeof raw[k]==='object'&&!Array.isArray(raw[k]))?raw[k]:{};
    return s;
  }
  function load(storage){
    const rawStr=storage.getItem(KEY);
    if(rawStr==null)return blank();
    let raw=null,parsed=true;
    try{raw=JSON.parse(rawStr);}catch(e){parsed=false;}
    const s=parsed?validate(raw):null;
    if(!s){try{storage.setItem(BAK,rawStr);}catch(e){}return blank();}
    return s;
  }
  function save(state,storage){storage.setItem(KEY,JSON.stringify(state));}
  function exportJson(state){return JSON.stringify(state);}
  function importJson(str){let raw;try{raw=JSON.parse(str);}catch(e){return null;}return validate(raw);}
  return {KEY,BAK,blank,validate,load,save,exportJson,importJson};
})();
</script>

  function toast(msg){const t=el('<div class="toast"></div>');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800);}

    const sheet=el('<div class="sheet"><h2></h2><div class="sheet-body"></div></div>');

    sheet.querySelector('.sheet-body').innerHTML=bodyHtml;

  function closeSheet(){$('#sheetRoot').innerHTML='';}
  // 通用表单：fields [{key,label,type:'text|number|date|dt|select|textarea',options,required,min,max,step,placeholder,value}]
  // type 'dt' 渲染 datetime-local，读取时 T→空格
  function openForm(o){
    openSheet(o.title,o.fields.map(f=>{
      let inp;
      if(f.type==='select')inp='<select data-k="'+f.key+'">'+f.options.map(x=>'<option value="'+x.v+'"'+(f.value===x.v?' selected':'')+'>'+x.t+'</option>').join('')+'</select>';
      else if(f.type==='textarea')inp='<textarea data-k="'+f.key+'" rows="2" placeholder="'+(f.placeholder||'')+'">'+esc(f.value||'')+'</textarea>';
      else inp='<input data-k="'+f.key+'" type="'+(f.type==='dt'?'datetime-local':(f.type||'text'))+'" value="'+(f.value!=null?String(f.value).replace(' ','T'):'')+'" placeholder="'+(f.placeholder||'')+'"'+(f.step?' step="'+f.step+'"':'')+'>';
      return '<div class="frow"><label>'+f.label+'</label>'+inp+'<div class="err" data-err="'+f.key+'"></div></div>';
    }).join('')+'<button class="btn" id="formOk">保存</button>');
    $('#formOk').onclick=()=>{
      const vals={};let bad=false;
      for(const f of o.fields){
        const node=document.querySelector('[data-k="'+f.key+'"]');let v=node.value.trim();
        if(f.type==='dt')v=v.replace('T',' ');
        const errEl=document.querySelector('[data-err="'+f.key+'"]');errEl.style.display='none';
        if(f.required&&!v){errEl.textContent='必填';errEl.style.display='block';bad=true;continue;}
        if(f.type==='number'&&v!==''){
          const n=Number(v);
          if(isNaN(n)||(f.min!=null&&n<f.min)||(f.max!=null&&n>f.max)){errEl.textContent='需在 '+(f.min!=null?f.min:'')+' ~ '+(f.max!=null?f.max:'')+' 之间';errEl.style.display='block';bad=true;continue;}
        }
        vals[f.key]=(f.type==='number')?(v===''?null:Number(v)):v;
      }
      if(bad)return;
      closeSheet();o.onSubmit(vals);
    };
  }

  function switchTab(t){

  const Charts={_p:null,_insts:[],
    load(){if(!this._p)this._p=new Promise((res,rej)=>{const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
      s.onload=()=>res(window.Chart);s.onerror=()=>rej(new Error('cdn fail'));document.head.appendChild(s);});
      return this._p;},
    async draw(canvas,config){try{const C=await this.load();const ch=new C(canvas,config);this._insts.push(ch);}
      catch(e){if(canvas&&canvas.parentNode)canvas.parentNode.innerHTML='<div class="empty">图表加载失败，请检查网络后重试</div>';}},
    destroy(){this._insts.forEach(c=>{try{c.destroy();}catch(e){}});this._insts=[];}
  };

  function bindOps(scope,arr,kind){
    scope.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      if(!ask('删除这条记录？'))return;
      const i=arr.findIndex(x=>x.id===b.dataset.del);if(i>=0)arr.splice(i,1);
      save();renderTab();
    });

  function openRecordForm(kind,edit){
    const now=L.nowStr();
    if(kind==='feed'){
      const f=edit||{};
      openForm({title:(edit?'编辑':'')+'🍼 记吃奶',fields:[
        {key:'dt',label:'时间',type:'dt',required:true,value:f.dt||now},
        {key:'method',label:'方式',type:'select',options:[{v:'breast',t:'亲喂母乳'},{v:'bottleM',t:'瓶喂母乳'},{v:'formula',t:'配方奶'}],value:f.method||'formula'},
        {key:'ml',label:'奶量 ml（亲喂可估填）',type:'number',min:0,max:350,value:f.ml},
        {key:'durationMin',label:'时长 分钟',type:'number',min:0,max:120,required:true,value:f.durationMin},
        {key:'side',label:'单双侧（亲喂）',type:'select',options:[{v:'',t:'—'},{v:'left',t:'仅左侧'},{v:'right',t:'仅右侧'},{v:'both',t:'双侧'}],value:f.side||''},
        {key:'note',label:'备注',type:'textarea',value:f.note||''}
      ],onSubmit:v=>{
        if(v.method!=='breast'&&v.ml==null){toast('瓶喂请填奶量');return;}
        let endDt=v.dt;
        if(v.durationMin>0){const d=L.parseDt(v.dt);d.setMinutes(d.getMinutes()+v.durationMin);endDt=L.fmtDt(d);}
        upsert(S.feedings,{id:f.id||L.uid(),dt:v.dt,method:v.method,ml:v.ml||0,durationMin:v.durationMin,endDt,side:v.side||null,note:v.note});
        save();renderTab();toast('已保存');
      }});
    }
    if(kind==='sleep'){
      const f=edit||{};
      openForm({title:(edit?'编辑':'')+'😴 记睡眠',fields:[
        {key:'start',label:'开始时间',type:'dt',required:true,value:f.start||now},
        {key:'end',label:'结束时间',type:'dt',required:true,value:f.end||''},
        {key:'note',label:'备注',type:'textarea',value:f.note||''}
      ],onSubmit:v=>{
        const m=L.sleepMin(v.start,v.end);
        if(m<=0){toast('结束时间需晚于开始时间');return;}
        upsert(S.sleeps,{id:f.id||L.uid(),start:v.start,end:v.end,durationMin:m,note:v.note});
        save();renderTab();toast('已保存');
      }});
    }
    else if(kind==='diaper'){
      const f=edit||{};
      openForm({title:(edit?'编辑':'')+'🧷 记尿布',fields:[
        {key:'dt',label:'时间',type:'dt',required:true,value:f.dt||now},
        {key:'type',label:'类型',type:'select',options:[{v:'wet',t:'小便'},{v:'soiled',t:'大便'},{v:'both',t:'都有'}],value:f.type||'wet'},
        {key:'stool',label:'大便性状（如有）',type:'select',options:[{v:'',t:'—'},{v:'黄糊',t:'黄糊'},{v:'绿色',t:'绿色'},{v:'稀水',t:'稀水'},{v:'干硬',t:'干硬'},{v:'血丝(建议就医)',t:'血丝(建议就医)'}],value:f.stool||''},
        {key:'note',label:'备注',type:'textarea',value:f.note||''}
      ],onSubmit:v=>{
        upsert(S.diapers,{id:f.id||L.uid(),dt:v.dt,type:v.type,stool:v.type==='wet'?'':v.stool,note:v.note});
        save();renderTab();toast('已保存');
      }});
    }
    else if(kind==='growth'){
      const f=edit||{};
      openForm({title:(edit?'编辑':'')+'📏 记生长',fields:[
        {key:'date',label:'日期',type:'date',required:true,value:f.date||L.todayStr()},
        {key:'weightKg',label:'体重 kg',type:'number',min:2,max:8,step:0.01,value:f.weightKg},
        {key:'heightCm',label:'身高 cm',type:'number',min:40,max:100,step:0.1,value:f.heightCm},
        {key:'headCm',label:'头围 cm（选填）',type:'number',min:30,max:50,step:0.1,value:f.headCm},
        {key:'note',label:'备注',type:'textarea',value:f.note||''}
      ],onSubmit:v=>{
        if(v.weightKg==null&&v.heightCm==null){toast('体重身高至少填一项');return;}
        upsert(S.growth,{id:f.id||L.uid(),date:v.date,weightKg:v.weightKg,heightCm:v.heightCm,headCm:v.headCm,note:v.note});
        save();renderTab();toast('已保存');
      }});
    }
    else if(kind==='recovery'){
      const f=edit||{};
      openForm({title:(edit?'编辑':'')+'👩 记恢复',fields:[
        {key:'date',label:'日期',type:'date',required:true,value:f.date||L.todayStr()},
        {key:'weightKg',label:'体重 kg（选填）',type:'number',min:30,max:120,step:0.1,value:f.weightKg},
        {key:'lochia',label:'恶露',type:'select',options:[{v:'',t:'—'},{v:'鲜红',t:'鲜红'},{v:'淡红',t:'淡红'},{v:'浆液色',t:'浆液色'},{v:'白色',t:'白色'},{v:'已干净',t:'已干净'}],value:f.lochia||''},
        {key:'wound',label:'伤口/疤痕',type:'select',options:[{v:'',t:'—'},{v:'干燥愈合',t:'干燥愈合'},{v:'轻微发红',t:'轻微发红'},{v:'红肿渗液',t:'红肿渗液(建议就医)'}],value:f.wound||''},
        {key:'note',label:'备注',type:'textarea',value:f.note||''}

        save();renderTab();toast('已保存');
      }});
    }

    const rank={due:0,soon:1,future:2,done:3};
    const stT={due:'该打了',soon:'临近',future:'未到',done:'已接种'};
    const rows=DATA.vaccines.map(v=>({v,st:L.vaccineStatus(v,S.vaccineRecords[v.key],b,t)}));
    rows.sort((a,c)=>rank[a.st.status]-rank[c.st.status]||a.v.month-c.v.month);
    const doneN=rows.filter(r=>r.st.status==='done').length;
    const item=r=>'<div class="list-item" data-vk="'+r.v.key+'" style="cursor:pointer"><div><b>'+r.v.name+'</b> <span class="chip '+(r.v.type==='free'?'free':'paid')+'">'+(r.v.type==='free'?'免费':'自费')+'</span>'+
      '<div style="font-size:12px;color:var(--sub)">'+r.v.month+'月龄 · '+r.v.dose+' · 应种 '+r.st.dueDate+(r.st.status==='done'&&S.vaccineRecords[r.v.key]?' · 实种 '+S.vaccineRecords[r.v.key].date:'')+(r.v.note?'<br>'+r.v.note:'')+'</div></div>'+
      '<span class="chip" style="'+(r.st.status==='due'?'background:#FDECEA;color:#B03A34':(r.st.status==='done'?'background:#E8F4EC;color:#3E7D5C':''))+'">'+stT[r.st.status]+'</span></div>';
    const within=rows.filter(r=>r.v.month<=24),later=rows.filter(r=>r.v.month>24);
    $('#screen-vaccine').innerHTML=
      '<div class="card"><h3>接种进度</h3><div class="stat">'+
        '<div class="s"><b>'+doneN+'</b><span>已完成剂次</span></div>'+
        '<div class="s"><b>'+rows.length+'</b><span>总剂次</span></div>'+
        '<div class="s"><b>'+rows.filter(r=>r.st.status==='due').length+'</b><span>待接种</span></div></div>'+
        '<div class="warn-note">点击任意疫苗可标记接种/取消；提醒按应种月龄推算，仅供参考，以接种门诊通知为准</div></div>'+
      '<div class="card"><h3>24月龄内</h3>'+within.map(item).join('')+'</div>'+
      '<div class="card"><h3>2岁以后 <button class="btn sm ghost" id="moreVac">展开/收起</button></h3><div id="laterList" style="display:none">'+later.map(item).join('')+'</div></div>';
    $('#moreVac').onclick=()=>{const l=$('#laterList');l.style.display=l.style.display==='none'?'':'none';};
    document.querySelectorAll('[data-vk]').forEach(n=>n.onclick=()=>{
      const key=n.dataset.vk,v=DATA.vaccines.find(x=>x.key===key),rec=S.vaccineRecords[key];
      openSheet(v.name,
        '<div class="frow"><label>状态</label>'+(rec&&rec.done?'<button class="btn ghost" id="vCancel">取消接种标记</button>':'<button class="btn" id="vDone">✓ 标记已接种</button>')+'</div>'+
        '<div class="frow"><label>实际接种日期</label><input type="date" id="vDate" value="'+((rec&&rec.date)||L.todayStr())+'"></div>'+
        '<div class="frow"><label>备注</label><textarea id="vNote" rows="2">'+esc((rec&&rec.note)||'')+'</textarea></div>');
      const ok=$('#vDone');if(ok)ok.onclick=()=>{S.vaccineRecords[key]={done:true,date:$('#vDate').value||L.todayStr(),note:$('#vNote').value};save();closeSheet();renderTab();toast('已记录');};
      const cc=$('#vCancel');if(cc)cc.onclick=()=>{delete S.vaccineRecords[key];save();closeSheet();renderTab();toast('已取消');};
    });
  }
  let momPlan=null,momPlanDay=null;
  function renderMom(){
    Charts.destroy();
    const b=S.profile.birthDate,t=L.todayStr();
    if(momPlanDay!==t){momPlan=null;momPlanDay=t;}
    const st=L.ppStage(b,t);
    if(momPlan==null)momPlan=S.dietChoice[t]!=null?S.dietChoice[t]:null;
    const plans=DATA.diet[st.id];
    if(momPlan==null)momPlan=L.parseDate(t).getDay()%plans.length;
    momPlan=((momPlan%plans.length)+plans.length)%plans.length;
    const plan=plans[momPlan];
    const care=DATA.care[st.id];
    const isC=S.profile.delivery==='c-section';
    const recList=S.recovery.slice().reverse().slice(0,7);
    const ws=S.recovery.slice().sort((a,c)=>a.date<c.date?-1:1).filter(r=>r.weightKg!=null);
    $('#screen-mom').innerHTML=
      '<div class="card"><h3>我的食谱</h3><div style="margin-bottom:8px"><span class="chip">'+st.label+'</span></div>'+
        '<div class="seg">'+plans.map((p,i)=>'<button data-p="'+i+'" style="flex:0 0 auto;padding:8px 14px"'+(i===momPlan?' class="active"':'')+'>方案'+(i+1)+'</button>').join('')+'</div>'+
        [['breakfast','早餐'],['lunch','午餐'],['dinner','晚餐'],['snack','加餐']].map(kv=>'<div class="list-item"><b style="min-width:3em">'+kv[1]+'</b><span style="text-align:right">'+plan[kv[0]].join('、')+'</span></div>').join('')+
        '<div class="warn-note">'+DATA.stages.find(x=>x.id===st.id).dietFocus+'</div></div>'+
      '<div class="card"><h3>恢复记录 <button class="btn sm" id="addRec">＋ 记一笔</button></h3>'+
        (recList.length?recList.map(r=>'<div class="list-item"><div><b>'+r.date.slice(5)+'</b>'+(r.weightKg!=null?' · '+r.weightKg+'kg':'')+(r.lochia?' · 恶露'+r.lochia:'')+(r.wound?' · 伤口'+r.wound:'')+
          (r.note?'<div style="font-size:12px;color:var(--sub)">'+esc(r.note)+'</div>':'')+'</div>'+
          '<div class="ops"><button data-edit="'+r.id+'">改</button><button data-del="'+r.id+'">删</button></div></div>').join('')
          :'<div class="empty">记录体重、恶露、伤口情况</div>')+
        (ws.length>=2?'<canvas id="momW" height="160"></canvas>':'')+'</div>'+
      '<div class="card"><h3>护理指引 · '+care.title+'</h3><div class="article"><h4>护理要点</h4><ul>'+care.points.map(p=>'<li>'+p+'</li>').join('')+'</ul>'+
        (isC&&care.cSection&&care.cSection.length?'<h4>剖腹产专项</h4><ul>'+care.cSection.map(p=>'<li>'+p+'</li>').join('')+'</ul>':'')+
        '<div class="warn-note">仅供参考，不构成医疗建议，遵医嘱</div></div></div>'+
      '<div class="card"><h3>哺乳安全速查</h3><input id="safetyQ" placeholder="搜索药物/食物，如：布洛芬" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px"><div id="safetyList" style="margin-top:8px"></div><div class="warn-note">仅供参考，不构成医疗建议，用药请遵医嘱</div></div>'+
      '<div class="card"><h3>设置</h3>'+
        '<button class="btn ghost" id="editProfile">编辑宝宝/妈妈资料</button>'+
        '<button class="btn ghost" id="exportBtn">导出数据备份(JSON)</button>'+
        '<button class="btn ghost" id="importBtn">导入数据</button>'+
        '<button class="btn ghost" id="resetBtn" style="color:#B03A34">清空全部数据</button>'+
        '<input type="file" id="impFile" accept=".json" hidden></div>';
    document.querySelectorAll('[data-p]').forEach(btn=>btn.onclick=()=>{momPlan=+btn.dataset.p;S.dietChoice[t]=momPlan;save();renderMom();});
    $('#addRec').onclick=()=>openRecordForm('recovery');
    bindOps($('#screen-mom'),S.recovery,'recovery');
    if(ws.length>=2)Charts.draw(document.getElementById('momW'),{type:'line',data:{labels:ws.map(r=>r.date.slice(5)),datasets:[{data:ws.map(r=>r.weightKg),borderColor:'#E8876B',pointBackgroundColor:'#E8876B',tension:.3}]},options:{plugins:{legend:{display:false}},devicePixelRatio:2}});
    renderSafety('');$('#safetyQ').oninput=e=>renderSafety(e.target.value.trim());
    $('#editProfile').onclick=editProfile;
    $('#exportBtn').onclick=doExport;
    $('#importBtn').onclick=()=>$('#impFile').click();
    $('#impFile').onchange=importFile;
    $('#resetBtn').onclick=()=>{if(ask('确定清空全部数据？建议先导出备份。')){localStorage.removeItem(Store.KEY);localStorage.removeItem(Store.BAK);location.reload();}};
  }
  function renderSafety(q){
    const list=DATA.safety.filter(e=>!q||e.name.includes(q)||e.cat.includes(q));
    $('#safetyList').innerHTML=list.length?list.map(e=>'<div class="list-item"><div><b>'+e.name+'</b> <span class="chip">'+e.cat+'</span><div style="font-size:12px;color:var(--sub)">'+e.note+'</div></div><span class="chip" style="background:#FBE9E2">'+e.level+'</span></div>').join(''):'<div class="empty">无匹配条目</div>';
  }
  function editProfile(){
    const p=S.profile;
    openForm({title:'编辑资料',fields:[
      {key:'babyName',label:'宝宝昵称',value:p.babyName},
      {key:'gender',label:'性别',type:'select',options:[{v:'girl',t:'女宝'},{v:'boy',t:'男宝'}],value:p.gender},
      {key:'birthDate',label:'出生日期',type:'date',required:true,value:p.birthDate},
      {key:'birthWeightKg',label:'出生体重 kg',type:'number',min:1,max:6,step:0.01,value:p.birthWeightKg},
      {key:'birthHeightCm',label:'出生身高 cm',type:'number',min:40,max:60,step:0.1,value:p.birthHeightCm},
      {key:'delivery',label:'分娩方式',type:'select',options:[{v:'vaginal',t:'顺产'},{v:'c-section',t:'剖腹产'}],value:p.delivery},
      {key:'momWeightKg',label:'妈妈体重 kg（选填）',type:'number',min:35,max:120,step:0.1,value:p.momWeightKg}
    ],onSubmit:v=>{S.profile=Object.assign({},p,v);save();momPlan=null;recDate=null;renderTab();toast('资料已更新，全App已联动');}});
  }
  function doExport(){
    const blob=new Blob([Store.exportJson(S)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='postpartum-backup-'+L.todayStr()+'.json';a.click();URL.revokeObjectURL(a.href);
    toast('已导出');
  }
  function importFile(e){
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=()=>{const parsed=Store.importJson(String(r.result));
      if(!parsed){toast('导入失败：文件格式不正确');return;}
      if(!parsed.profile){toast('导入的文件缺少宝宝资料');return;}
      S=parsed;save();momPlan=null;recDate=null;renderTab();toast('导入成功');};
    r.readAsText(file);e.target.value='';
  }
  function renderWizard(){
    $('#app').hidden=true;$('#wizard').hidden=false;
    $('#wizard').innerHTML='<div class="wizard"><h1>欢迎使用 👶</h1><p class="tip">先填宝宝出生信息，食谱、疫苗、护理都会自动跟上</p>'+
      '<div class="card">'+
      '<div class="frow"><label>宝宝昵称</label><input id="w-name" placeholder="如：小汤圆"></div>'+
      '<div class="frow"><label>性别</label><select id="w-gender"><option value="girl">女宝</option><option value="boy">男宝</option></select></div>'+
      '<div class="frow"><label>出生日期</label><input id="w-birth" type="date"></div>'+
      '<div class="frow"><label>出生体重 kg</label><input id="w-weight" type="number" min="1" max="6" step="0.01" placeholder="如 3.3"></div>'+
      '<div class="frow"><label>出生身高 cm</label><input id="w-height" type="number" min="40" max="60" step="0.1" placeholder="如 50"></div>'+
      '<div class="frow"><label>分娩方式</label><select id="w-delivery"><option value="vaginal">顺产</option><option value="c-section">剖腹产</option></select></div>'+
      '<div class="frow"><label>妈妈体重 kg（选填）</label><input id="w-momw" type="number" min="35" max="120" step="0.1"></div>'+
      '<button class="btn" id="w-ok">开始使用</button></div></div>';
    $('#w-ok').onclick=()=>{
      const birth=$('#w-birth').value;
      if(!birth){toast('请填写出生日期');return;}
      S.profile={babyName:$('#w-name').value.trim(),gender:$('#w-gender').value,birthDate:birth,
        birthWeightKg:Number($('#w-weight').value)||0,birthHeightCm:Number($('#w-height').value)||0,
        delivery:$('#w-delivery').value,momWeightKg:Number($('#w-momw').value)||0};
      save();enterApp();
    };
  }
  function enterApp(){
    if(!S.profile){renderWizard();return;}
    $('#wizard').hidden=true;$('#app').hidden=false;
    $('#bottomnav').innerHTML=[['home','🏠','今日'],['records','🍼','记录'],['growth','📏','成长'],['vaccine','💉','疫苗'],['mom','👩','妈妈']]
      .map(x=>'<div class="nav-item" data-t="'+x[0]+'"><span class="ico">'+x[1]+'</span>'+x[2]+'</div>').join('');
    document.querySelectorAll('.nav-item').forEach(n=>n.onclick=()=>switchTab(n.dataset.t));
    $('#fab').onclick=onFab;
    switchTab('home');
  }
  function onFab(){
    const map={home:'feed',records:(recSeg==='sleep'||recSeg==='diaper')?recSeg:'feed',growth:'growth',vaccine:'feed',mom:'recovery'};
    openRecordForm(map[tab]);
  }
  document.addEventListener('DOMContentLoaded',()=>{ if(S.profile)enterApp(); else renderWizard(); });
  return {get state(){return S;},switchTab,openSheet,closeSheet,toast};
})();
</script>
</body>
</html>
